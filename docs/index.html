<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>firesite — dónde poner una cámara contra incendios</title>
<meta name="description" content="14 años de incendios vistos desde satélite, para decidir dónde poner una cámara de detección temprana. Y cuánto de eso el terreno no te deja ver.">
<meta property="og:title" content="firesite — dónde poner una cámara contra incendios">
<meta property="og:description" content="El relieve esconde casi la mitad del fuego. Esta herramienta te dice cuánto, antes de que compres nada.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb; --surface-2: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --hairline: #e1e0d9;
    --ramp-1: #86b6ef; --ramp-2: #3987e5; --ramp-3: #1c5cab; --ramp-4: #0d366b;
    --alpha-1: 0.35; --alpha-2: 0.75; --alpha-3: 0.9; --alpha-4: 0.95;
    --accent: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19; --surface-2: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --hairline: #2c2c2a;
      --ramp-1: #1c5cab; --ramp-2: #2a78d6; --ramp-3: #5598e7; --ramp-4: #9ec5f4;
      --alpha-1: 0.5; --alpha-2: 0.8; --alpha-3: 0.9; --alpha-4: 0.95;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --hairline: #2c2c2a;
    --ramp-1: #1c5cab; --ramp-2: #2a78d6; --ramp-3: #5598e7; --ramp-4: #9ec5f4;
    --alpha-1: 0.5; --alpha-2: 0.8; --alpha-3: 0.9; --alpha-4: 0.95;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-2); color: var(--text-primary);
  }
  .viz-root { display: flex; height: 100%; }
  aside {
    width: 400px; flex: 0 0 400px; overflow-y: auto; padding: 20px 22px 40px;
    background: var(--surface-1); border-right: 1px solid var(--hairline);
  }
  main { flex: 1; position: relative; }
  #map { position: absolute; inset: 0; background: var(--surface-2); }

  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .brand { font-size: 17px; font-weight: 680; letter-spacing: -0.02em; }
  .spacer { margin-left: auto; }
  .chip {
    border: 1px solid var(--hairline); background: none; color: var(--text-secondary);
    border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px;
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--text-muted); color: var(--text-primary); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text-primary); }
  select.chip { max-width: 160px; padding-right: 6px; }
  .note { font-size: 12px; color: var(--text-muted); margin: -8px 0 16px; }

  h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--text-muted); margin: 24px 0 9px; font-weight: 650; }
  p.lede { font-size: 14px; color: var(--text-secondary); margin: 0 0 18px; }
  p.sub { font-size: 12.5px; color: var(--text-muted); margin: 8px 0 0; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .tile .value { font-size: 27px; font-weight: 680; letter-spacing: -.025em;
                 font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tile .label { font-size: 11.5px; color: var(--text-muted); }
  .tile .value.hl { color: var(--accent); }

  .ctrl { margin: 12px 0 8px; }
  .ctrl label { display: flex; justify-content: space-between; font-size: 12.5px;
                color: var(--text-secondary); margin-bottom: 5px; }
  .ctrl label b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 7px; }

  .player { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .play {
    width: 38px; height: 38px; border-radius: 50%; flex: none; cursor: pointer;
    border: 1px solid var(--accent); background: none; color: var(--accent);
    font-size: 13px; display: grid; place-items: center; transition: background .15s;
  }
  .play:hover { background: rgba(208,59,59,.12); }
  .track { flex: 1; height: 4px; background: var(--hairline); border-radius: 2px; }
  .fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0;
          transition: width .18s linear; }
  .year { font-variant-numeric: tabular-nums; font-weight: 650; min-width: 42px;
          text-align: right; }

  .legend-row { display: flex; align-items: center; gap: 10px; margin: 6px 0;
                font-size: 13px; color: var(--text-secondary); }
  .dot { width: 13px; height: 13px; border-radius: 50%; flex: 0 0 13px; }
  .bar-row { display: grid; grid-template-columns: 34px 1fr 44px; gap: 8px;
             align-items: center; margin: 4px 0; font-size: 12.5px;
             color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .bar-track { display: block; height: 9px; background: var(--hairline);
               border-radius: 2px; overflow: hidden; }
  .bar { display: block; height: 9px; background: var(--ramp-2); border-radius: 2px;
         transition: width .5s cubic-bezier(.2,.7,.3,1); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px;
          font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 10.5px; text-transform: uppercase;
       letter-spacing: .05em; color: var(--text-muted); font-weight: 650;
       padding: 5px 5px 5px 0; border-bottom: 1px solid var(--hairline); }
  td { padding: 5px 5px 5px 0; border-bottom: 1px solid var(--hairline);
       color: var(--text-secondary); }
  td.num { text-align: right; }
  tr.best td { color: var(--text-primary); font-weight: 650; }

  footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--hairline);
           font-size: 11.5px; color: var(--text-muted); line-height: 1.6; }
  footer a { color: inherit; }
  .drop { margin-top: 16px; padding: 12px; border: 1px dashed var(--hairline);
          border-radius: 8px; font-size: 12px; color: var(--text-muted);
          text-align: center; transition: border-color .15s; }
  .drop.hot { border-color: var(--accent); color: var(--text-primary); }
  .drop label { text-decoration: underline; cursor: pointer; }
  #file { display: none; }

  .fade-in { animation: fade .5s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
    .bar, .fill { transition: none; }
  }
  @media (max-width: 900px) {
    .viz-root { flex-direction: column; }
    aside { width: 100%; flex: none; border-right: none;
            border-bottom: 1px solid var(--hairline); max-height: 52vh; }
    main { flex: 1; min-height: 48vh; }
  }
</style>
</head>
<body>
<div class="viz-root">
  <aside>
    <div class="topbar">
      <span class="brand">firesite</span>
      <span class="spacer"></span>
      <select class="chip" id="dataset" aria-label="dataset"></select>
      <button class="chip" id="lang" type="button">EN</button>
      <button class="chip" id="theme" type="button" aria-pressed="false">&#9686;</button>
    </div>

    <p class="lede" id="lede"></p>
    <p class="note" id="dataset-note"></p>

    <div class="tiles fade-in">
      <div class="tile">
        <div class="value" id="t-detections">&ndash;</div>
        <div class="label" id="t-detections-l"></div>
      </div>
      <div class="tile">
        <div class="value hl" id="t-hidden">&ndash;</div>
        <div class="label" id="t-hidden-l"></div>
      </div>
      <div class="tile">
        <div class="value" id="t-years">&ndash;</div>
        <div class="label" id="t-years-l"></div>
      </div>
      <div class="tile">
        <div class="value" id="t-cells">&ndash;</div>
        <div class="label" id="t-cells-l"></div>
      </div>
    </div>

    <h2 id="h-play"></h2>
    <div class="player">
      <button class="play" id="play" type="button">&#9654;</button>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span class="year" id="year"></span>
    </div>
    <p class="sub" id="play-note"></p>

    <h2 id="h-filters"></h2>
    <div class="ctrl">
      <label><span id="f-recurrence"></span><b id="f-recurrence-v">1+</b></label>
      <input type="range" id="min-years" min="1" max="10" value="1">
    </div>
    <div class="toggles">
      <button class="chip" id="f-visible" type="button" aria-pressed="true"></button>
      <button class="chip" id="f-hidden" type="button" aria-pressed="true"></button>
    </div>

    <h2 id="h-sectors"></h2>
    <div id="sectors"></div>

    <h2 id="h-optics"></h2>
    <table id="optics">
      <thead><tr>
        <th id="th-optics"></th><th class="num" id="th-range"></th>
        <th class="num" id="th-resolved"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <p class="sub" id="optics-note"></p>

    <h2 id="h-legend"></h2>
    <div id="legend"></div>

    <div class="drop" id="drop"><span id="drop-text"></span></div>
    <input type="file" id="file" accept="application/json,.json">

    <footer id="footer"></footer>
  </aside>
  <main><div id="map"></div></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const I18N = {
  es: {
    other: "EN",
    lede: "Una cámara puede ver un incendio a los pocos minutos. La pregunta aburrida es <b>en qué cerro ponerla</b>. Esto la responde con años de detecciones satelitales, y luego comprueba cuánto de ese fuego el <b>relieve no te deja ver</b>.",
    detections: "detecciones de fuego",
    hidden: "oculto por el relieve",
    yearsLabel: "años de historia",
    cells: "celdas que ardieron",
    play: function (n) { return n + " años en 10 segundos"; },
    playNote: "Cada punto aparece el año que ardió. Lo que se acumula es el patrón, no el incendio de turno.",
    filters: "Filtros",
    recurrence: "Años mínimos con fuego",
    showHidden: "ocultas por relieve",
    showVisible: "visibles",
    sectors: "Hacia dónde está el fuego",
    optics: "Qué cámara lo resuelve",
    thOptics: "Óptica", thRange: "Alcance", thResolved: "Resuelve",
    opticsNote: "Porcentaje del fuego en rango donde una columna de 30 m ocuparía 8 píxeles o más. Ese umbral es una estimación de ingeniería, no una constante publicada.",
    legend: "Años distintos con fuego",
    site: "cámara y su alcance",
    hiddenLegend: "oculto por el relieve",
    band1: "1 año", band2: "2-4 años", band3: "5-7 años", band4: "8+ años",
    cellArea: "El área del círculo son detecciones acumuladas; el color, en cuántos años distintos ardió.",
    drop: "Arrastra aquí tu JSON de <code>firesite export</code>, o <label for=\"file\">elige un archivo</label>.",
    popYears: function (n) { return n + (n === 1 ? " año" : " años") + " con fuego"; },
    popDet: function (d, days) { return d + " detecciones en " + days + " días"; },
    popPower: function (p) { return "potencia máxima " + p + " MW"; },
    popLast: function (d) { return "visto por última vez " + d; },
    popHidden: "oculto por el relieve",
    camera: "Cámara",
    inRange: function (n) { return n + " detecciones en el radio"; },
    terrainChecked: "Línea de visión comprobada contra el modelo de elevación; los círculos huecos están ocultos por el relieve.",
    terrainUnchecked: "El relieve no se comprobó aquí, así que un punto bien situado puede estar detrás de una loma.",
    sourcesA: "Historial de incendios de", sourcesB: "elevación de", built: "Hecho con",
    noData: function (m) { return "Sin datos (" + m + "). Arrastra un export abajo."; }
  },
  en: {
    other: "ES",
    lede: "A camera can spot a fire within minutes. The boring question is <b>which hill to put it on</b>. This answers that from years of satellite detections, then checks how much of that fire the <b>terrain hides</b>.",
    detections: "fire detections",
    hidden: "hidden by terrain",
    yearsLabel: "years of history",
    cells: "cells that burned",
    play: function (n) { return n + " years in 10 seconds"; },
    playNote: "Each dot appears the year it burned. What accumulates is the pattern, not this season's fire.",
    filters: "Filters",
    recurrence: "Minimum years with fire",
    showHidden: "hidden by terrain",
    showVisible: "visible",
    sectors: "Where the fire sits",
    optics: "Which camera resolves it",
    thOptics: "Optics", thRange: "Range", thResolved: "Resolved",
    opticsNote: "Share of in-range fire where a 30 m plume would span 8 pixels or more. That threshold is an engineering estimate, not a published constant.",
    legend: "Distinct years with fire",
    site: "camera and its reach",
    hiddenLegend: "hidden by terrain",
    band1: "1 year", band2: "2-4 years", band3: "5-7 years", band4: "8+ years",
    cellArea: "Circle area is accumulated detections; colour is how many distinct years it burned.",
    drop: "Drop your <code>firesite export</code> JSON here, or <label for=\"file\">choose a file</label>.",
    popYears: function (n) { return n + (n === 1 ? " year" : " years") + " with fire"; },
    popDet: function (d, days) { return d + " detections over " + days + " days"; },
    popPower: function (p) { return "peak power " + p + " MW"; },
    popLast: function (d) { return "last seen " + d; },
    popHidden: "hidden by terrain",
    camera: "Camera",
    inRange: function (n) { return n + " detections within reach"; },
    terrainChecked: "Line of sight was checked against the elevation model; hollow circles are hidden by terrain.",
    terrainUnchecked: "Terrain was not checked here, so a well-placed dot may sit behind a ridge.",
    sourcesA: "Fire history from", sourcesB: "elevation from", built: "Built with",
    noData: function (m) { return "No dataset (" + m + "). Drop an export below."; }
  }
};

var BANDS = [
  { min: 1, max: 1, key: "band1", varName: "--ramp-1", alphaVar: "--alpha-1" },
  { min: 2, max: 4, key: "band2", varName: "--ramp-2", alphaVar: "--alpha-2" },
  { min: 5, max: 7, key: "band3", varName: "--ramp-3", alphaVar: "--alpha-3" },
  { min: 8, max: 1e9, key: "band4", varName: "--ramp-4", alphaVar: "--alpha-4" }
];

var lang = (navigator.language || "es").indexOf("es") === 0 ? "es" : "en";
var data = null, playing = false, cursor = null, timer = null;
var showHidden = true, showVisible = true, minYears = 1;
var catalog = [];

function t() { return I18N[lang]; }
function css(name) {
  return getComputedStyle(document.querySelector(".viz-root")).getPropertyValue(name).trim();
}
function bandFor(y) {
  for (var i = 0; i < BANDS.length; i++) {
    if (y >= BANDS[i].min && y <= BANDS[i].max) return BANDS[i];
  }
  return BANDS[0];
}
function fmt(n) { return n.toLocaleString(lang === "es" ? "es-EC" : "en-US"); }
function byId(id) { return document.getElementById(id); }

var map = L.map("map", { zoomControl: true });
var TILES = {
  light: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  dark: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
};
var tiles = null, layer = L.layerGroup().addTo(map);

function theme() {
  return document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function applyTheme() {
  if (tiles) map.removeLayer(tiles);
  tiles = L.tileLayer(TILES[theme()], {
    attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19
  }).addTo(map);
  if (data) { renderPanels(); draw(); }
}

function reduceMotion() {
  return matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function countTo(el, target, suffix) {
  suffix = suffix || "";
  if (reduceMotion()) { el.textContent = fmt(target) + suffix; return; }
  var start = performance.now(), dur = 900;
  function step(now) {
    var p = Math.min(1, (now - start) / dur);
    var eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(target * eased)) + suffix;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function years() {
  return Object.keys(data.by_year).map(Number).sort(function (a, b) { return a - b; });
}

function passes(cell) {
  if (cell.years < minYears) return false;
  var hidden = cell.visible === false;
  if (hidden && !showHidden) return false;
  if (!hidden && !showVisible) return false;
  if (cursor !== null && (cell.y || []).indexOf(cursor) === -1) return false;
  return true;
}

function draw() {
  layer.clearLayers();
  var maxDet = 1;
  for (var i = 0; i < data.cells.length; i++) {
    if (data.cells[i].detections > maxDet) maxDet = data.cells[i].detections;
  }
  data.cells.filter(passes).forEach(function (cell) {
    var band = bandFor(cell.years);
    var hidden = cell.visible === false;
    L.circleMarker([cell.lat, cell.lon], {
      radius: 3 + 9 * Math.sqrt(cell.detections / maxDet),
      color: css(band.varName),
      weight: hidden ? 1.6 : 0.6,
      dashArray: hidden ? "2 2" : null,
      fillColor: css(band.varName),
      fillOpacity: hidden ? 0 : parseFloat(css(band.alphaVar))
    }).bindPopup(
      "<b>" + t().popYears(cell.years) + "</b><br>" +
      t().popDet(cell.detections, cell.days) + "<br>" +
      t().popPower(cell.max_frp) + "<br>" + t().popLast(cell.last_seen) +
      (hidden ? "<br><b>" + t().popHidden + "</b>" : "")
    ).addTo(layer);
  });

  if (data.site) {
    var s = data.site;
    L.circle([s.lat, s.lon], {
      radius: s.radius_km * 1000, color: css("--accent"), weight: 1.5,
      dashArray: "6 5", fillColor: css("--accent"), fillOpacity: 0.05
    }).addTo(layer);
    L.circleMarker([s.lat, s.lon], {
      radius: 8, color: "#fff", weight: 2, fillColor: css("--accent"), fillOpacity: 1
    }).bindPopup("<b>" + t().camera + "</b><br>" + t().inRange(fmt(s.detections_in_range)))
      .addTo(layer);
  }
}

function setCursor(y) {
  cursor = y;
  var ys = years();
  byId("year").textContent = y === null ? "" : y;
  var i = y === null ? ys.length - 1 : ys.indexOf(y);
  byId("fill").style.width = (100 * (i + 1) / ys.length) + "%";
  draw();
}

function play() {
  var ys = years(), i = 0;
  playing = true;
  byId("play").innerHTML = "&#10074;&#10074;";
  clearInterval(timer);
  timer = setInterval(function () {
    if (i >= ys.length) { stop(true); return; }
    setCursor(ys[i++]);
  }, 10000 / ys.length);
}

function stop(finished) {
  playing = false;
  clearInterval(timer);
  byId("play").innerHTML = "&#9654;";
  if (finished) setCursor(null);
}

function bars(target, entries, format) {
  var peak = 1;
  entries.forEach(function (e) { if (e[1] > peak) peak = e[1]; });
  target.innerHTML = entries.map(function (e) {
    return '<div class="bar-row"><span>' + e[0] + '</span>' +
      '<span class="bar-track"><span class="bar" style="width:' +
      Math.max(1, 100 * e[1] / peak) + '%"></span></span>' +
      '<span style="text-align:right">' + format(e[1]) + '</span></div>';
  }).join("");
}

function renderPanels() {
  var g = data.generated_from || {}, s = data.site;
  byId("h-play").textContent = t().play(years().length);
  countTo(byId("t-detections"), g.detections || 0);
  var hidEl = byId("t-hidden");
  if (s && s.visible_detections !== null && s.visible_detections !== undefined) {
    countTo(hidEl, Math.round(100 * (1 - s.visible_detections / s.detections_in_range)), "%");
  } else {
    hidEl.textContent = "—";
  }
  countTo(byId("t-years"), years().length);
  countTo(byId("t-cells"), data.cells.length);

  if (s && s.sectors) {
    var total = 0;
    Object.keys(s.sectors).forEach(function (k) { total += s.sectors[k]; });
    bars(byId("sectors"), Object.keys(s.sectors).map(function (k) {
      return [k, s.sectors[k]];
    }), function (v) { return Math.round(100 * v / (total || 1)) + "%"; });
  }

  var rows = (s && s.optics) || [], body = document.querySelector("#optics tbody");
  if (rows.length) {
    var best = 0;
    rows.forEach(function (r) { if (r.share_resolved > best) best = r.share_resolved; });
    body.innerHTML = rows.map(function (r) {
      return '<tr class="' + (r.share_resolved === best ? "best" : "") + '"><td>' +
        r.optics + '</td><td class="num">' + r.useful_range_km +
        ' km</td><td class="num">' + Math.round(100 * r.share_resolved) + '%</td></tr>';
    }).join("");
  } else { body.innerHTML = ""; }

  var anyHidden = data.cells.some(function (c) { return c.visible === false; });
  var html = BANDS.map(function (b) {
    var n = data.cells.filter(function (c) {
      return c.years >= b.min && c.years <= b.max;
    }).length;
    return '<div class="legend-row"><span class="dot" style="background:' +
      css(b.varName) + '; opacity:' + css(b.alphaVar) + '"></span><span>' +
      t()[b.key] + '</span><span style="margin-left:auto; color:var(--text-muted)">' +
      fmt(n) + '</span></div>';
  }).join("");
  html += '<div class="legend-row" style="margin-top:8px"><span class="dot" style="background:' +
    css("--accent") + '"></span><span>' + t().site + '</span></div>';
  if (anyHidden) {
    html += '<div class="legend-row"><span class="dot" style="border:1.6px dashed ' +
      css("--ramp-3") + '; background:none"></span><span>' + t().hiddenLegend + '</span></div>';
  }
  html += '<p class="sub">' + t().cellArea + '</p>';
  byId("legend").innerHTML = html;

  var checked = data.cells.some(function (c) {
    return c.visible !== undefined && c.visible !== null;
  });
  byId("footer").innerHTML =
    (checked ? t().terrainChecked : t().terrainUnchecked) + "<br><br>" +
    t().sourcesA + ' <a href="https://firms.modaps.eosdis.nasa.gov/" rel="noopener">NASA FIRMS</a>, ' +
    t().sourcesB + ' <a href="https://spacedata.copernicus.eu/" rel="noopener">Copernicus DEM GLO-30</a>. ' +
    t().built + ' <a href="https://github.com/LuisReinoso/firesite" rel="noopener">firesite</a>.';
}

function applyLanguage() {
  document.documentElement.lang = lang;
  byId("lang").textContent = t().other;
  var text = {
    lede: t().lede, "t-detections-l": t().detections, "t-hidden-l": t().hidden,
    "t-years-l": t().yearsLabel, "t-cells-l": t().cells, "h-play": data ? t().play(years().length) : "",
    "play-note": t().playNote, "h-filters": t().filters, "f-recurrence": t().recurrence,
    "f-hidden": t().showHidden, "f-visible": t().showVisible, "h-sectors": t().sectors,
    "h-optics": t().optics, "th-optics": t().thOptics, "th-range": t().thRange,
    "th-resolved": t().thResolved, "optics-note": t().opticsNote,
    "h-legend": t().legend, "drop-text": t().drop
  };
  Object.keys(text).forEach(function (id) { byId(id).innerHTML = text[id]; });
  if (catalog.length) fillSelector();
  if (data) { renderPanels(); draw(); }
}

byId("lang").onclick = function () {
  lang = lang === "es" ? "en" : "es";
  applyLanguage();
};
byId("theme").onclick = function (e) {
  var next = theme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  e.currentTarget.setAttribute("aria-pressed", next === "dark");
  applyTheme();
};
byId("play").onclick = function () { playing ? stop(false) : play(); };
byId("min-years").oninput = function (e) {
  minYears = +e.target.value;
  byId("f-recurrence-v").textContent = minYears + "+";
  draw();
};
byId("f-hidden").onclick = function (e) {
  showHidden = !showHidden;
  e.currentTarget.setAttribute("aria-pressed", showHidden);
  draw();
};
byId("f-visible").onclick = function (e) {
  showVisible = !showVisible;
  e.currentTarget.setAttribute("aria-pressed", showVisible);
  draw();
};

var drop = byId("drop"), fileInput = byId("file");
["dragenter", "dragover"].forEach(function (ev) {
  drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("hot"); });
});
["dragleave", "drop"].forEach(function (ev) {
  drop.addEventListener(ev, function () { drop.classList.remove("hot"); });
});
drop.addEventListener("drop", function (e) {
  e.preventDefault();
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", function (e) {
  if (e.target.files[0]) readFile(e.target.files[0]);
});
function readFile(file) {
  var r = new FileReader();
  r.onload = function () {
    try { load(JSON.parse(r.result)); } catch (err) { byId("lede").textContent = err.message; }
  };
  r.readAsText(file);
}

function load(json) {
  data = json;
  if (json.title) document.title = json.title + " — firesite";
  var maxYears = 2;
  data.cells.forEach(function (c) { if (c.years > maxYears) maxYears = c.years; });
  byId("min-years").max = maxYears;
  renderPanels();
  if (data.site) {
    map.setView([data.site.lat, data.site.lon], 11);
  } else {
    var la = data.cells.map(function (c) { return c.lat; });
    var lo = data.cells.map(function (c) { return c.lon; });
    map.fitBounds([[Math.min.apply(null, la), Math.min.apply(null, lo)],
                   [Math.max.apply(null, la), Math.max.apply(null, lo)]], { padding: [24, 24] });
  }
  setCursor(null);
  // A first-visit playthrough: the accumulation is the argument, and a still map
  // does not make it.
  if (!reduceMotion() && years().length > 1) setTimeout(play, 800);
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
applyTheme();
applyLanguage();

function fillSelector() {
  var sel = byId("dataset");
  sel.innerHTML = catalog.map(function (c, i) {
    return '<option value="' + i + '">' + c[lang] + "</option>";
  }).join("");
  sel.value = String(currentIndex());
  byId("dataset-note").textContent = catalog.length
    ? (catalog[currentIndex()][lang + "_note"] || "") : "";
}

function currentIndex() {
  for (var i = 0; i < catalog.length; i++) {
    if (catalog[i].file === requested) return i;
  }
  return 0;
}

function loadDataset(file) {
  requested = file;
  stop(false);
  fetch(file)
    .then(function (r) {
      if (!r.ok) throw new Error(r.status + " " + file);
      return r.json();
    })
    .then(function (json) { load(json); fillSelector(); })
    .catch(function (err) { byId("lede").textContent = t().noData(err.message); });
}

var requested = new URLSearchParams(location.search).get("data") || "data/cotacachi.json";
byId("dataset").onchange = function (e) {
  loadDataset(catalog[+e.target.value].file);
};

fetch("data/catalog.json")
  .then(function (r) { return r.ok ? r.json() : []; })
  .catch(function () { return []; })
  .then(function (list) {
    catalog = list || [];
    byId("dataset").style.display = catalog.length > 1 ? "" : "none";
    loadDataset(requested);
  });
</script>
</body>
</html>
