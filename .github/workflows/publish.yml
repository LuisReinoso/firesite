name: Publish to PyPI

# Trusted publishing: no API token stored anywhere. Configure the publisher once
# at https://pypi.org/manage/account/publishing/ for this repo and workflow.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
